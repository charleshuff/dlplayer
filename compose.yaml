services:
  yt-webplayer:
    build: .
    image: yt-webplayer
    restart: unless-stopped
    init: true
    ports:
      - "${BIND:-0.0.0.0}:${PORT:-3000}:8080"
    environment:
      PASSWORD: "${PASSWORD:-}"
      DEFAULT_QUALITY: "${DEFAULT_QUALITY:-1080}"
      UNPLAYED_DAYS: "${UNPLAYED_DAYS:-3}"
      MAX_VIDEOS: "${MAX_VIDEOS:-10}"
      MIN_FREE_GB: "${MIN_FREE_GB:-2}"
      VLC_HOST: "${VLC_HOST:-}"
      YTDLP_CHANNEL: "${YTDLP_CHANNEL:-nightly}"
      UPDATE_HOURS: "${UPDATE_HOURS:-3}"
      SPONSORBLOCK_CATEGORIES: "${SPONSORBLOCK_CATEGORIES-sponsor,selfpromo,interaction}"
    volumes:
      - data:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s

volumes:
  data:
